name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize Playwright
      run: |
        rfbrowser init
    
    - name: Create test directories
      run: |
        mkdir -p reports logs data
    
    - name: Run Robot Framework Tests
      env:
        APP_URL: ${{ secrets.APP_URL }}
        SSO_USERNAME: ${{ secrets.SSO_USERNAME }}
        SSO_PASSWORD: ${{ secrets.SSO_PASSWORD }}
        BROWSER_HEADLESS: 'True'
        EXCEL_FILE_PATH: './data/sample_records.xlsx'
      run: |
        robot --outputdir reports --xunit junit_results.xml *.robot
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-framework-reports
        path: |
          reports/
          logs/
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/junit_results.xml
        check_name: Robot Framework Test Results
    
    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-screenshots
        path: reports/screenshots/
